name: starter-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Compile Python source
        run: python -m compileall -q app starter_code tests
      - name: Run starter and student tests
        run: pytest -q tests
